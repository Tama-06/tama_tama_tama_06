<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир Путешествий — Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">🌍 Мир Путешествий</h1>
            <nav>
                <a href="index.html">Главная</a>
                <a href="about.html">О блоге</a>
                <a href="destinations.html">Направления</a>
                <a href="contact.html" class="active">Контакты</a>
            </nav>
        </div>
    </header>

    <section class="page-content">
        <div class="container">
            <h2 class="section-title">Свяжитесь со мной</h2>
            <p class="section-subtitle">Есть вопрос, предложение или идея для сотрудничества? Напишите мне!</p>

            <form class="contact-form" onsubmit="event.preventDefault(); alert('Спасибо! Сообщение отправлено.'); this.reset();">
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" placeholder="Введите ваше имя" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" rows="5" placeholder="Ваше сообщение..." required></textarea>
                </div>
                <button type="submit" class="btn">Отправить сообщение</button>
            </form>

            <div class="contact-info">
                <p>📧 Email: <a href="mailto:hello@example.com">hello@example.com</a></p>
                <p>📱 Телефон: +7 (999) 123-45-67</p>
                <p>📍 Город: Москва, Россия</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2025 Мир Путешествий. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
